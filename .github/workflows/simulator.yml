# .github/workflows/simulator.yml
#
# Builds the cpcraft-port simulator for Linux, Windows, and Web.
#
# - Linux: native SDL2 binary, uploaded as artifact.
# - Windows: cross-compiled with MinGW + SDL2 from vcpkg.
# - Web: Emscripten build, deployed to GitHub Pages.
#
# The simulator lets you run the engine on your PC without flashing to
# the ClassPad — useful for fast iteration on rendering / input logic.
#
# Based on NCInput_gint's simulator workflow, adapted for our Makefile-
# based (not CMake) build and HHK3 SDK (not gint).

name: Build Simulator

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install SDL2
      run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
    - name: Build simulator
      run: make sim
    - name: Upload Linux artifact
      uses: actions/upload-artifact@v4
      with:
        name: cpcraft-port-sim-linux
        path: simulator/out/cpcraft-port-sim

  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install SDL2 via vcpkg
      run: vcpkg install sdl2:x64-windows
    - name: Build simulator (MSYS2/MinGW)
      shell: msys2 {0}
      run: |
        # Use MSYS2's make + gcc. The simulator/Makefile uses gcc/g++.
        # SDL2 is installed via vcpkg into the vcpkg installed tree.
        make sim SDL2_DIR="$VCPKG_INSTALLATION_ROOT/installed/x64-windows"
    - name: Upload Windows artifact
      uses: actions/upload-artifact@v4
      with:
        name: cpcraft-port-sim-windows
        path: |
          simulator/out/cpcraft-port-sim.exe
          ${{ env.VCPKG_INSTALLATION_ROOT }}/installed/x64-windows/bin/SDL2.dll

  build-web:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Emscripten
      uses: emscripten-core/setup-emsdk@v15
      with:
        version: 3.1.74
        actions-cache-folder: 'emsdk-cache'
    - name: Verify emcc
      run: emcc -v
    - name: Build web simulator
      run: make sim-web
    - name: Prepare web artifacts
      run: |
        mkdir -p simulator/web/dist
        cp simulator/web/cpcraft-port.html simulator/web/dist/index.html
        cp simulator/web/cpcraft-port.js simulator/web/dist/
        cp simulator/web/cpcraft-port.wasm simulator/web/dist/
    - name: Upload web artifact
      uses: actions/upload-artifact@v4
      with:
        name: cpcraft-port-sim-web
        path: simulator/web/dist/

  deploy:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    needs: build-web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download web artifact
        uses: actions/download-artifact@v4
        with:
          name: cpcraft-port-sim-web
          path: .
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
