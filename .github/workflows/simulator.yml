# .github/workflows/simulator.yml
#
# Builds the cpcraft-port simulator for Linux, Windows, and Web.
#
# - Linux: native SDL2 binary, uploaded as artifact.
# - Windows: cross-compiled with MinGW + SDL2 from vcpkg.
# - Web: Emscripten build, deployed to GitHub Pages.
#
# The simulator lets you run the engine on your PC without flashing to
# the ClassPad — useful for fast iteration on rendering / input logic.
#
# Based on NCInput_gint's simulator workflow, adapted for our Makefile-
# based (not CMake) build and HHK3 SDK (not gint).

name: Build Simulator

on:
  push:
    branches: [ main, master, "z-port" ]
  pull_request:
    branches: [ main, master, "z-port" ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Install SDL2
      run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
    - name: Build simulator
      run: make sim
    - name: Upload Linux artifact
      uses: actions/upload-artifact@v7
      with:
        name: cpcraft-port-sim-linux
        path: simulator/out/cpcraft-port-sim

  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v6
    - name: Build
      run: |
        vcpkg install sdl2:x64-windows
        mkdir simulator/build
        cd simulator/build
        cmake .. -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -A x64
        cmake --build . --config Release
    - name: Upload Windows artifact
      uses: actions/upload-artifact@v7
      with:
        name: cpcraft-port-sim-windows
        path: |
          simulator/build/out/*.exe
          simulator/build/out/*.dll

  build-web:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Setup Emscripten
      uses: emscripten-core/setup-emsdk@v15
      with:
        version: 5.0.1
        emsdk-version: 5.0.5
        actions-cache-folder: 'emsdk-cache'
    - name: Verify emcc
      run: emcc -v
    - name: Build web simulator
      run: |
        cd simulator
        mkdir build_web
        cd build_web
        emcmake cmake ..
        emmake make
    - name: Prepare web artifacts
      run: |
        mkdir -p simulator/web/dist
        cp simulator/web/cpcraft-port.html simulator/web/dist/index.html
        cp simulator/web/cpcraft-port.js simulator/web/dist/
        cp simulator/web/cpcraft-port.wasm simulator/web/dist/
    - name: Upload web artifact
      uses: actions/upload-artifact@v7
      with:
        name: cpcraft-port-sim-web
        path: simulator/web/dist/

  deploy:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    needs: build-web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download web artifact
        uses: actions/download-artifact@v4
        with:
          name: cpcraft-port-sim-web
          path: .
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
