<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>cpcraft-port simulator</title>
    <style>
        body {
            margin: 0;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            color: #eee;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        #container {
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 12px;
        }
        canvas {
            border: 4px solid #444;
            background-color: white;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            max-width: 95vw;
            max-height: 90vh;
            width: auto;
            height: auto;
            aspect-ratio: 320 / 528;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .hint {
            font-size: 12px;
            color: #888;
            text-align: center;
            line-height: 1.5;
        }
        .hint kbd {
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 3px;
            padding: 1px 5px;
            font-family: monospace;
            font-size: 11px;
            color: #eee;
        }
    </style>
</head>
<body>
    <div id="container">
        <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
        <div class="hint">
            Arrows = D-pad &nbsp;|&nbsp; Enter/Space = EXE &nbsp;|&nbsp; Backspace = B &nbsp;|&nbsp; Esc = Menu/Quit<br>
            0-9 = number keys &nbsp;|&nbsp; X/Y/Z = X/Y/Z keys &nbsp;|&nbsp; Shift = Shift
        </div>
    </div>
    <script type='text/javascript'>
      var Module = {
        canvas: (function() { return document.getElementById('canvas'); })()
      };
    </script>
    {{{ SCRIPT }}}
</body>
</html>
